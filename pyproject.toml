[project]
name = "finwise-mcp"
version = "0.1.0"
description = "MCP server for Finwise personal finance"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "finwise-python>=1.4.0",
]

[project.scripts]
finwise-mcp = "finwise_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
